<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kumi - Asistente de Acompañamiento Emocional</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 700: '#15803d' }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.5); border-radius: 3px; }
        @keyframes pulse-subtle { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .typing-dot { animation: pulse-subtle 1.4s infinite ease-in-out both; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    </style>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 flex flex-col md:flex-row overflow-hidden">

    <aside class="w-full md:w-72 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 flex flex-col p-4 shrink-0">
        <div class="flex items-center space-x-3 mb-6">
            <div class="w-10 h-10 rounded-full bg-emerald-500 flex items-center justify-center text-white font-bold text-lg">K</div>
            <div>
                <h1 class="font-bold text-base">Kumi AI</h1>
                <span class="text-xs text-emerald-600 font-medium flex items-center gap-1">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> En línea
                </span>
            </div>
        </div>
        <button onclick="nuevoChat()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 px-4 rounded-xl transition-all">
            + Nueva Conversación
        </button>
    </aside>

    <main class="flex-1 flex flex-col h-full bg-slate-50 dark:bg-slate-950 relative">
        <header class="h-16 border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md px-6 flex items-center">
            <h2 class="font-bold text-base">Kumi - Apoyo Emocional & PAP</h2>
        </header>

        <div id="chat-container" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-6 max-w-4xl w-full mx-auto"></div>

        <footer class="p-4 bg-slate-100 dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800">
            <form onsubmit="enviarMensaje(event)" class="max-w-4xl mx-auto flex gap-2">
                <input type="text" id="user-input" placeholder="Escribe tu mensaje a Kumi..." class="flex-1 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                <button type="submit" id="send-button" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-3 rounded-xl font-medium text-sm transition-all">
                    Enviar
                </button>
            </form>
        </footer>
    </main>

    <script>
        let historialMensajes = [];

        window.addEventListener('DOMContentLoaded', () => {
            nuevoChat();
        });

        function nuevoChat() {
            historialMensajes = [];
            const chatContainer = document.getElementById('chat-container');
            chatContainer.innerHTML = '';
            agregarMensajeUI('assistant', '¡Hola! Soy Kumi. Estoy aquí para acompañarte. ¿Cómo te encuentras en este momento?');
        }

        function agregarMensajeUI(role, texto) {
            const chatContainer = document.getElementById('chat-container');
            const isUser = role === 'user';
            const wrapper = document.createElement('div');
            wrapper.className = `flex items-start gap-3 ${isUser ? 'flex-row-reverse' : ''}`;

            const avatar = document.createElement('div');
            avatar.className = `w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs text-white ${isUser ? 'bg-slate-600' : 'bg-emerald-500'}`;
            avatar.textContent = isUser ? 'Tú' : 'K';

            const bubble = document.createElement('div');
            bubble.className = `max-w-[75%] rounded-2xl px-4 py-2.5 text-sm ${isUser ? 'bg-emerald-600 text-white' : 'bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700'}`;
            bubble.textContent = texto;

            wrapper.appendChild(avatar);
            wrapper.appendChild(bubble);
            chatContainer.appendChild(wrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function enviarMensaje(event) {
            event.preventDefault();
            const input = document.getElementById('user-input');
            const texto = input.value.trim();
            if (!texto) return;

            input.value = '';
            agregarMensajeUI('user', texto);
            historialMensajes.push({ role: 'user', content: texto });

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ messages: historialMensajes })
                });

                const data = await response.json();
                if (data.choices && data.choices[0]) {
                    const respuesta = data.choices[0].message.content;
                    agregarMensajeUI('assistant', respuesta);
                    historialMensajes.push({ role: 'assistant', content: respuesta });
                } else {
                    agregarMensajeUI('assistant', 'Hubo un inconveniente al recibir la respuesta de Kumi.');
                }
            } catch (error) {
                agregarMensajeUI('assistant', 'Error de conexión con el servidor.');
            }
        }
    </script>
</body>
</html>
